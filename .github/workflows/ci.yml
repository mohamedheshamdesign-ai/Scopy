name: CI

on:
  push:
    branches: [dev, feature/scopy-v1-finalization]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, build, test, and doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-scopy.ps1 -SkipInstall
      - name: Typecheck, build, and test (Linux)
        if: runner.os == 'Linux'
        run: npm run check
