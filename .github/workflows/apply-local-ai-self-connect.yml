        run: tar -xzf /tmp/payload.tar.gz -C "$GITHUB_WORKSPACE"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Commit the reviewed files
        run: |
          git config user.name "scopy-ci"
          git config user.email "ci@users.noreply.github.com"
          git add README.md docs/LOCAL_AI_WINDOWS.md src/ai/create-local-router.ts src/ai/local-connection.ts src/cli.ts src/dashboard/dashboard-server.ts src/doctor/doctor.ts tests/doctor.test.ts tests/local-connection.test.ts
