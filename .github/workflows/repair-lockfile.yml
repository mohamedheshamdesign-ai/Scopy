name: repair-lockfile
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/repair-lockfile.yml
permissions:
  contents: write
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  commit-lockfile:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "scopy-ci"
          git config user.email "ci@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: regenerate package-lock.json under Node 24"
          git push origin dev
